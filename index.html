<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150823">
<meta name="color-scheme" content="dark">
<title>Weed Rating</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weed Rating">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Permanent+Marker&family=Rubik:wght@400..700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* 90s stoner blacklight poster: purple wall with lava-lamp blobs, cards as stickers (butter paper, black outline, hard purple shadow), a rasta stripe under the header and a sleepy smiley. One deliberate dark look. */
:root{
  --bg:#150823; --sheet:#1E0C36; --paper:#FFF8DC; --paper-2:#EADFB0;
  --ink:#140A1E; --ink-soft:#4B3A63; --on-bg:#FFF6E0; --muted:#C3A9E8;
  --edge:#0B0412; --line:#5A2D96; --shadow:#6D28D9;
  --pink:#FF2E93; --teal:#00E5C7; --amber:#FFC21A; --green:#39E27A; --orange:#FF8A3D; --violet:#7B2FFF;
  --taste:#E8203F; --smell:#12A150; --priceScore:#F2A900; --danger:#C4162A;
  --scrim:rgba(8,3,16,.72); --lb:rgba(8,3,16,.94); --lb-ink:#FFF6E0;
  --font-display:'Bowlby One','Arial Black','Segoe UI',system-ui,sans-serif;
  --font-marker:'Permanent Marker','Marker Felt','Comic Sans MS',cursive;
  --font-body:'Rubik','Segoe UI',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  margin:0; background:var(--bg); color:var(--on-bg);
  font:400 16px/1.45 var(--font-body); -webkit-text-size-adjust:100%;
  padding-block:20px 128px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wall{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 38% at 8% 6%, rgba(255,46,147,.42), transparent 70%),
    radial-gradient(55% 36% at 96% 28%, rgba(0,229,199,.28), transparent 70%),
    radial-gradient(75% 42% at 15% 68%, rgba(123,47,255,.45), transparent 70%),
    radial-gradient(60% 36% at 92% 98%, rgba(255,194,26,.28), transparent 70%);
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.muted{color:var(--muted)}

/* Header */
.logo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.logo h1{
  margin:0;font:400 clamp(2.4rem,13vw,3.4rem)/.92 var(--font-display);text-transform:uppercase;
  color:var(--amber);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--violet);letter-spacing:.01em;
}
.logo h1 span{display:block}
.smiley{flex:none;width:clamp(54px,17vw,76px);height:auto;margin-bottom:6px}
.rasta{
  height:16px;margin-top:14px;border:3px solid var(--edge);border-radius:9px;
  background:linear-gradient(to bottom,var(--taste) 0 33.33%,var(--priceScore) 0 66.66%,var(--smell) 0);
}
.sub{margin:12px 0 0;font:400 1.05rem/1.3 var(--font-marker);color:var(--teal);overflow-wrap:anywhere}
.banner{padding:10px 12px;border:3px solid var(--edge);background:var(--amber);color:var(--ink);border-radius:12px;font-size:.9rem;font-weight:500}

/* Search and sorting */
.tools{display:flex;flex-direction:column;gap:12px;min-width:0}
.search{
  width:100%;padding:12px 14px;border:3px solid var(--edge);border-radius:12px;
  background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--shadow);
}
.search::placeholder,.input::placeholder{color:var(--ink-soft);opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 14px;border-radius:999px;border:2px solid var(--line);
  background:var(--sheet);color:var(--on-bg);font:600 .88rem var(--font-body);
}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--edge);color:var(--ink);box-shadow:3px 3px 0 var(--pink)}

.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 4px 4px 0}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;
  border:3px solid var(--line);background:var(--sheet);color:var(--on-bg);
  font:700 .88rem var(--font-body);box-shadow:3px 3px 0 var(--edge);
}
.tab[aria-selected="true"]{background:var(--amber);color:var(--ink);border-color:var(--edge);box-shadow:3px 3px 0 var(--pink)}
.tab-n{font:700 .72rem var(--font-mono);opacity:.85}

/* Cards */
.list{display:flex;flex-direction:column;gap:18px;margin:0;padding:0;list-style:none}
.card{
  position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--edge);
  border-radius:16px;box-shadow:5px 5px 0 var(--shadow);
}
.card.sel{box-shadow:5px 5px 0 var(--teal)}
.card-main{
  display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;width:100%;
  padding:14px;margin:0;border:0;background:none;text-align:left;border-radius:13px;color:inherit;
}
div.card-main{cursor:default}
.total{display:flex;flex-direction:column;align-items:center;gap:3px}
.rank{font:400 1rem/1.1 var(--font-marker);color:var(--violet);min-height:1.1em}
.num{
  display:grid;place-items:center;width:60px;height:60px;border-radius:50%;
  background:var(--tier,var(--amber));border:3px solid var(--edge);color:var(--ink);
  font:400 1.3rem/1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}
.lbl{font:700 .6rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.info{min-width:0}
.info h3{margin:0;font:400 1.1rem/1.15 var(--font-display);overflow-wrap:anywhere;padding-right:6.4rem}
.meta{margin:.3rem 0 .8rem;color:var(--ink-soft);font-size:.85rem;overflow-wrap:anywhere}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:3.3rem minmax(0,1fr) 2.5rem;gap:8px;align-items:center}
.bar-row .lab{font:700 .66rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.bar-row.on .lab{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.bar-row .val{font:700 .85rem var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.track{display:block;height:12px;border-radius:999px;background:var(--paper-2);border:2px solid var(--edge);overflow:hidden}
.fill{display:block;height:100%;background:var(--c);border-right:2px solid var(--edge)}
.cmp{
  position:absolute;top:10px;right:10px;min-height:34px;padding:5px 11px;border-radius:10px;
  border:2px solid var(--edge);background:var(--paper-2);color:var(--ink);
  font:600 .78rem var(--font-body);box-shadow:2px 2px 0 var(--edge);
}
.cmp[aria-pressed="true"]{background:var(--teal)}
.tag{
  position:absolute;top:12px;right:12px;padding:3px 10px;border-radius:999px;background:var(--pink);
  border:2px solid var(--edge);font:700 .66rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)
}

/* Empty state */
.empty{display:flex;flex-direction:column;gap:14px}
.empty h2{margin:0;font:400 1.5rem/1.1 var(--font-display);color:var(--amber);text-shadow:2px 2px 0 var(--pink)}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.example{opacity:.7}
.foot{margin:0;font-size:.82rem;color:var(--muted)}

/* Bottom bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to top, var(--bg) 70%, transparent);
}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:12px}
.btn{
  min-height:50px;padding:0 18px;border-radius:14px;border:3px solid var(--edge);
  font:700 1rem var(--font-body);letter-spacing:.02em;color:var(--ink);box-shadow:4px 4px 0 var(--edge);
}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}
.btn-primary{background:var(--green);flex:1;box-shadow:4px 4px 0 var(--pink)}
.btn-primary:active{box-shadow:2px 2px 0 var(--pink)}
.btn-ghost{background:var(--paper);box-shadow:4px 4px 0 var(--teal)}
.btn-danger{background:var(--paper);color:var(--danger);box-shadow:4px 4px 0 var(--edge)}
.btn[disabled]{opacity:.6;cursor:default}
.link{background:none;border:0;padding:8px 0;color:var(--teal);font:600 .95rem var(--font-body);text-decoration:underline;text-underline-offset:3px}

/* Sheet (form and compare) */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:calc(100% - 12px);overflow-y:auto;background:var(--sheet);color:var(--on-bg);
  border:3px solid var(--edge);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -6px 0 var(--pink);
  padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
@media (min-width:640px){
  .scrim{align-items:center}
  .sheet{border:3px solid var(--edge);border-radius:22px;max-height:calc(100% - 48px);padding-bottom:24px;box-shadow:6px 6px 0 var(--pink)}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{margin:0;font:400 1.45rem/1.1 var(--font-display);color:var(--amber);text-shadow:2px 2px 0 var(--pink)}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.legend{font:700 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.input{
  width:100%;min-width:0;padding:12px 14px;border:3px solid var(--edge);border-radius:12px;
  background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);
}
textarea.input{resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--paper);box-shadow:3px 3px 0 var(--shadow)}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.field .seg label{
  padding:10px 0;text-align:center;cursor:pointer;background:var(--paper);color:var(--ink);
  font:600 .95rem var(--font-body);text-transform:none;letter-spacing:0;
}
.field .seg label:not(:first-of-type){border-left:3px solid var(--edge)}
.seg input:checked + label{background:var(--amber)}
.seg input:focus-visible + label{outline:3px solid var(--teal);outline-offset:-5px}
.scores{display:flex;flex-direction:column;gap:14px}
.score{
  display:grid;gap:8px;padding:12px 14px;background:var(--paper);color:var(--ink);
  border:3px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow)
}
.score-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score-name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--edge);flex:none}
.score-num{
  width:5.4rem;padding:4px 8px;text-align:right;border:2px solid var(--edge);border-radius:9px;background:var(--paper-2);color:var(--ink);
  font:700 1.4rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;
}
.score-num::-webkit-inner-spin-button,.score-num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score-ctl{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;gap:10px;align-items:center}
.step{
  width:42px;height:42px;border-radius:50%;border:2px solid var(--edge);background:var(--c);color:var(--ink);
  font:700 1.4rem/1 var(--font-body);box-shadow:2px 2px 0 var(--edge);padding:0
}
.step:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
.score input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--c)}
.hint{margin:0;font-size:.82rem;color:var(--ink-soft)}
.sum{display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.sum-val{font:400 2.3rem/1 var(--font-display);color:var(--amber);text-shadow:2px 2px 0 var(--pink);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--amber);font-size:.9rem;font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions .btn-primary{min-width:9rem}

/* Compare */
.cgroup{display:grid;gap:9px;padding:14px;background:var(--paper);color:var(--ink);border:3px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);margin-bottom:16px}
.cg-title{display:flex;align-items:center;gap:8px;margin:0 0 2px;font:700 .72rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.crow{display:grid;grid-template-columns:minmax(0,7rem) minmax(0,1fr) 3.6rem;gap:10px;align-items:center}
.cname{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .fill{opacity:.45}
.crow.best .fill,.crow.flat .fill{opacity:1}
.cval{font:700 .88rem var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.crow.best .cval{color:var(--ink)}
.crow.best .cname{font-weight:700}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}

/* Photos */
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.th,.more{width:48px;height:48px;border-radius:9px}
.th{object-fit:cover;border:2px solid var(--edge);background:var(--paper-2)}
.more{display:grid;place-items:center;background:var(--paper-2);border:2px solid var(--edge);font:700 .8rem var(--font-mono);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.pth{position:relative;aspect-ratio:1;max-width:100%}
.pimg{display:block;width:100%;height:100%;padding:0;border:3px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--paper-2);box-shadow:3px 3px 0 var(--shadow)}
.pimg img{display:block;width:100%;height:100%;object-fit:cover}
.px{position:absolute;top:-6px;right:-6px;width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);background:var(--pink);color:var(--ink);font-size:1.2rem;line-height:1;font-weight:700;padding:0}
.padd{aspect-ratio:1;border:3px dashed var(--muted);border-radius:12px;background:transparent;color:var(--muted);font:700 .95rem var(--font-body)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lb{position:fixed;inset:0;z-index:40;background:var(--lb);display:flex;align-items:center;justify-content:center;padding:60px 12px 20px}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border:3px solid var(--edge);border-radius:8px}
.lb-x{
  position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));
  min-height:40px;padding:0 14px;border-radius:10px;border:2px solid var(--lb-ink);background:transparent;color:var(--lb-ink);font:600 .95rem var(--font-body)
}
</style>
</head>
<body>

<div class="wall" aria-hidden="true"></div>

<main class="wrap">
  <header class="head">
    <div class="logo">
      <h1><span>Weed</span><span>Rating</span></h1>
      <svg class="smiley" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="#FFC21A" stroke="#0B0412" stroke-width="4"/>
        <ellipse cx="22" cy="27" rx="7" ry="6" fill="#FFD9DF" stroke="#0B0412" stroke-width="2.5"/>
        <ellipse cx="42" cy="27" rx="7" ry="6" fill="#FFD9DF" stroke="#0B0412" stroke-width="2.5"/>
        <circle cx="23" cy="29" r="2.8" fill="#0B0412"/>
        <circle cx="41" cy="29" r="2.8" fill="#0B0412"/>
        <path d="M14.5 28.5a7.5 7.5 0 0 1 15 0z" fill="#FFC21A" stroke="#0B0412" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M34.5 28.5a7.5 7.5 0 0 1 15 0z" fill="#FFC21A" stroke="#0B0412" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M17 42q15 13 30 0" fill="none" stroke="#0B0412" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="rasta" aria-hidden="true"></div>
    <p class="sub" id="sub"></p>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="tools" id="tools" hidden>
    <div class="tabs" id="tabs" role="tablist" aria-label="Type"></div>
    <input id="q" class="search" type="search" placeholder="Search by name or coffeeshop" autocomplete="off" aria-label="Search">
    <div class="chips" id="chips" role="group" aria-label="Sort by"></div>
  </div>
  <div id="content"></div>
  <p class="foot" id="foot"></p>
</main>

<div class="bar">
  <div class="bar-in">
    <button class="btn btn-primary" id="btn-new" type="button" data-act="new">+ New strain</button>
    <button class="btn btn-ghost" id="btn-cmp" type="button" data-act="cmp" hidden></button>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
</div>

<div class="lb" id="lb" hidden>
  <img id="lb-img" alt="Photo">
  <button type="button" class="lb-x" data-act="lbclose">Close</button>
</div>

<script>
(function(){
  'use strict';

  var CATS=[{k:'taste',l:'Taste'},{k:'smell',l:'Smell'},{k:'priceScore',l:'Price'}];
  var TYPES=['Indica','Sativa','Hybrid'];
  var SORTS=[{k:'total',l:'Total'},{k:'taste',l:'Taste'},{k:'smell',l:'Smell'},{k:'priceScore',l:'Price'},{k:'thc',l:'THC'},{k:'eur',l:'€/g'},{k:'new',l:'Newest'}];
  var HINTS={
    taste:'How does it taste, and what about the aftertaste?',
    smell:'How does it smell in the jar and when you grind it?',
    priceScore:'10 means a great price for what you get.'
  };
  var LS_KEY='weed-rating-v1', LS_SORT='weed-rating-sort', LS_TAB='weed-rating-tab';

  var nf1=new Intl.NumberFormat('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1});
  var nfThc=new Intl.NumberFormat('en-GB',{maximumFractionDigits:1});
  var nfEur=new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR'});
  var fmt=function(n){return nf1.format(n)};
  var fmtThc=function(n){return nfThc.format(n)+'%'};
  var r1=function(v){return Math.round(v*10)/10};
  var clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};

  var S={items:[],status:'loading',mode:'local',sort:'total',tab:'all',q:'',sel:[],sheet:null,editId:null,draftId:null,confirmDel:false,saving:false,banner:'',assets:null,draftPhotos:[],uploaded:[],removed:[],uploading:0,photoErr:'',formToken:0};
  var col=null;

  var $=function(s,r){return (r||document).querySelector(s)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var tot=function(it){return (Number(it.taste)+Number(it.smell)+Number(it.priceScore))/3};
  var inTab=function(it){return S.tab==='all'||it.type===S.tab};
  var tier=function(v){return v>=8.5?'var(--green)':v>=7?'var(--amber)':v>=5.5?'var(--orange)':'var(--pink)'};
  var newId=function(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
  var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var fmtDate=function(s){
    if(!s)return '';
    var p=s.split('-'); if(p.length!==3)return '';
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    var opts={day:'numeric',month:'short'};
    if(d.getFullYear()!==new Date().getFullYear())opts.year='numeric';
    return d.toLocaleDateString('en-GB',opts);
  };
  var numOrNull=function(v){return (v==null||v===''||isNaN(Number(v)))?null:Number(v)};
  var norm=function(id,d){
    return {
      id:id,name:String(d.name||'Unnamed'),type:TYPES.indexOf(d.type)>=0?d.type:'Hybrid',shop:String(d.shop||''),
      price:numOrNull(d.price),thc:numOrNull(d.thc),boughtAt:String(d.boughtAt||''),
      taste:Number(d.taste)||1,smell:Number(d.smell)||1,priceScore:Number(d.priceScore)||1,
      notes:String(d.notes||''),
      photos:Array.isArray(d.photos)?d.photos.filter(function(p){return typeof p==='string'&&p}).slice(0,6):[],
      createdAt:Number(d.createdAt)||0,updatedAt:Number(d.updatedAt)||0
    };
  };

  /* ---------- storage (IndexedDB, on this device) ---------- */
  var idb=null,P={};
  function idbOpen(){
    return new Promise(function(res,rej){
      var r=indexedDB.open('weed-rating',1);
      r.onupgradeneeded=function(){
        var d=r.result;
        if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
        if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
      };
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    });
  }
  function tx(store,mode,fn){
    return new Promise(function(res,rej){
      var t=idb.transaction(store,mode),out=fn(t.objectStore(store));
      t.oncomplete=function(){res(out&&out.result)};
      t.onerror=function(){rej(t.error)};
      t.onabort=function(){rej(t.error)};
    });
  }
  function purl(id){return P[id]||''}
  function persist(it){
    var p=idb?tx('items','readwrite',function(st){return st.put(it)}):Promise.resolve();
    return p.then(function(){
      var i=S.items.findIndex(function(x){return x.id===it.id});
      if(i>=0)S.items[i]=it;else S.items.push(it);
    });
  }
  function remove(id){
    var p=idb?tx('items','readwrite',function(st){return st.delete(id)}):Promise.resolve();
    return p.then(function(){S.items=S.items.filter(function(x){return x.id!==id})});
  }
  var PHOTO_STORE={
    upload:function(blob){
      var id=newId();
      return tx('photos','readwrite',function(st){return st.put({id:id,blob:blob})}).then(function(){
        P[id]=URL.createObjectURL(blob);return {id:id};
      });
    },
    delete:function(id){
      return tx('photos','readwrite',function(st){return st.delete(id)}).then(function(){
        if(P[id]){URL.revokeObjectURL(P[id]);delete P[id]}
      });
    }
  };
  async function boot(){
    try{
      idb=await idbOpen();
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e2){}
      var items=await tx('items','readonly',function(st){return st.getAll()});
      S.items=(items||[]).map(function(x){return norm(x.id,x)});
      var ph=await tx('photos','readonly',function(st){return st.getAll()});
      (ph||[]).forEach(function(p){if(p&&p.blob)P[p.id]=URL.createObjectURL(p.blob)});
      S.assets=PHOTO_STORE;S.mode='local';S.status='ready';
    }catch(e){
      S.banner='Storage is not available, so nothing will be saved.';S.mode='mem';S.assets=null;S.status='ready';
    }
    renderAll();
  }

  /* ---------- sorting ---------- */
  function sortAll(){
    var nulls=function(f){return function(x,y){return ((f(x)==null)-(f(y)==null))}};
    var cmp={
      total:function(x,y){return tot(y)-tot(x)},
      taste:function(x,y){return y.taste-x.taste},
      smell:function(x,y){return y.smell-x.smell},
      priceScore:function(x,y){return y.priceScore-x.priceScore},
      thc:function(x,y){return nulls(function(i){return i.thc})(x,y)||(y.thc-x.thc)},
      eur:function(x,y){return nulls(function(i){return i.price})(x,y)||(x.price-y.price)},
      'new':function(x,y){return (y.boughtAt||'').localeCompare(x.boughtAt||'')||(y.createdAt-x.createdAt)}
    }[S.sort];
    return S.items.slice().sort(function(x,y){return cmp(x,y)||(tot(y)-tot(x))||x.name.localeCompare(y.name,'en')});
  }

  function saveForm(){
    if(S.saving)return;
    if(S.uploading){S.photoErr='Wait until the photo has finished uploading.';renderPhotos();return}
    var name=$('#f-name').value.trim(),en=$('#err-name');
    if(!name){en.hidden=false;$('#f-name').focus();return}

    var old=S.editId?S.items.find(function(x){return x.id===S.editId}):null;
    var checked=document.querySelector('input[name=type]:checked');
    var it={
      id:S.draftId,name:name,type:checked?checked.value:'Hybrid',shop:$('#f-shop').value.trim(),price:price,thc:thc,

      taste:r1(Number($('#f-taste').value)),smell:r1(Number($('#f-smell').value)),priceScore:r1(Number($('#f-priceScore').value)),

  function cmpHTML(items){
    var groups=[
      {l:'Total',c:'var(--amber)',v:tot,best:'max',f:fmt,scale:10},
      {l:'Taste',c:'var(--taste)',v:function(i){return i.taste},best:'max',f:fmt,scale:10},
      {l:'Smell',c:'var(--smell)',v:function(i){return i.smell},best:'max',f:fmt,scale:10},
      {l:'Price (score)',c:'var(--priceScore)',v:function(i){return i.priceScore},best:'max',f:fmt,scale:10},
      {l:'Euro per gram',c:'var(--pink)',v:function(i){return i.price},best:'min',f:function(n){return nfEur.format(n)},scale:null},
      {l:'THC',c:'var(--violet)',v:function(i){return i.thc},best:null,f:fmtThc,scale:null}
    ];
    var html='<div class="sheet-head"><h2 id="sheet-title">Compare</h2><button type="button" class="link" data-act="close">Close</button></div>';
    groups.forEach(function(g){
      var vals=items.map(g.v).filter(function(v){return v!=null});
      var bestV=vals.length&&g.best?(g.best==='max'?Math.max.apply(null,vals):Math.min.apply(null,vals)):null;
      var scale=g.scale||(vals.length?Math.max.apply(null,vals):1)||1;
      var tie=vals.length>1&&vals.every(function(v){return v===vals[0]});
      html+='<section class="cgroup" style="--c:'+g.c+'"><h3 class="cg-title"><span class="dot"></span>'+g.l+'</h3>'+
        items.map(function(it){
          var v=g.v(it),has=v!=null,cls='';
          if(!g.best)cls=' flat';else if(has&&v===bestV&&!tie)cls=' best';
          return '<div class="crow'+cls+'"><span class="cname" title="'+esc(it.name)+'">'+esc(it.name)+'</span>'+
            '<span class="track"><span class="fill" style="width:'+(has?Math.max(3,v/scale*100):0)+'%"></span></span>'+
            '<span class="cval">'+(has?g.f(v):'–')+'</span></div>';
        }).join('')+'</section>';
    });
    html+='<div class="cfoot"><button type="button" class="link" data-act="clear">Clear selection</button><button type="button" class="btn btn-ghost" data-act="close">Done</button></div>';
    return html;
  }

  function dropAssets(ids){

  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var max=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej(new Error('encode'))},'image/jpeg',0.82);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('load'))};
      img.src=url;
    });
  }

        '<button type="button" class="px" data-act="pdel" data-id="'+esc(id)+'" aria-label="Delete photo '+(i+1)+'">×</button></div>';

  async function handleFiles(inp){
    var files=Array.prototype.slice.call(inp.files||[]);inp.value='';
    if(!files.length||!S.assets)return;
    files=files.slice(0,Math.max(0,6-S.draftPhotos.length));
    var tok=S.formToken;S.photoErr='';
    for(var i=0;i<files.length;i++){
      S.uploading++;renderPhotos();
      try{
        var blob=await shrink(files[i]);
        var r=await S.assets.upload(blob,{type:'image/jpeg'});
        if(tok!==S.formToken){try{S.assets.delete(r.id).catch(function(){})}catch(e){}return}
        S.draftPhotos.push(r.id);S.uploaded.push(r.id);
      }catch(e){
        if(tok!==S.formToken)return;
        S.photoErr=(e&&e.code==='quota_or_state')?'Photo storage is full.':'Adding the photo failed. Please try again.';
      }
      if(tok!==S.formToken)return;
      S.uploading--;renderPhotos();
    }
  }
  function openLb(id){$('#lb-img').src=purl(id);$('#lb').hidden=false}
  function closeLb(){$('#lb').hidden=true;$('#lb-img').removeAttribute('src')}

  /* ---------- events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-act]');
    if(e.target.closest('#lb')){closeLb();return}
    if(e.target.id==='scrim'){hideSheet();return}
    if(!t)return;
    var a=t.getAttribute('data-act'),id=t.getAttribute('data-id');
    if(a==='new')openForm(null);
    else if(a==='edit')openForm(id);
    else if(a==='close')hideSheet();
    else if(a==='del')deleteItem();
    else if(a==='tab'){
      S.tab=t.getAttribute('data-k');
      try{localStorage.setItem(LS_TAB,S.tab)}catch(err){}
      renderHead();renderTools();renderList();
    }
    else if(a==='sort'){
      S.sort=t.getAttribute('data-k');
      try{localStorage.setItem(LS_SORT,S.sort)}catch(err){}
      renderTools();renderList();
    }
    else if(a==='sel'){
      var i=S.sel.indexOf(id);
      if(i>=0)S.sel.splice(i,1);else{S.sel.push(id);if(S.sel.length>3)S.sel.shift()}
      renderList();renderBar();
    }
    else if(a==='step'){
      var k=t.getAttribute('data-k'),d=Number(t.getAttribute('data-d'));
      setScore(k,Number($('#f-'+k).value)+d*0.1);
    }
    else if(a==='padd'){var fi=$('#f-photo');if(fi)fi.click()}
    else if(a==='pdel')removePhoto(id);
    else if(a==='pview')openLb(id);
    else if(a==='cmp')openCompare();
    else if(a==='clear'){S.sel=[];hideSheet();renderList();renderBar()}
  });
  document.addEventListener('submit',function(e){
    if(e.target&&e.target.id==='form'){e.preventDefault();saveForm()}
  });
  document.addEventListener('input',function(e){
    var t=e.target,k;
    if(t.id==='q'){S.q=t.value;renderList();return}
    if(t.type==='range'&&t.id.indexOf('f-')===0){
      k=t.id.slice(2);
      var n=$('#n-'+k);if(n)n.value=Number(t.value).toFixed(1);
      updateSum();
    }else if(t.type==='number'&&t.id.indexOf('n-')===0){
      k=t.id.slice(2);
      var v=parseFloat(t.value);
      if(isFinite(v)){$('#f-'+k).value=clamp(r1(v),1,10);updateSum()}
    }
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t&&t.id==='f-photo'){handleFiles(t);return}
    if(t&&t.type==='number'&&t.id.indexOf('n-')===0){
      var k=t.id.slice(2),v=parseFloat(t.value);
      setScore(k,isFinite(v)?v:Number($('#f-'+k).value));
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('#lb').hidden){closeLb();return}
    if(S.sheet)hideSheet();
  });
  document.addEventListener('error',function(e){
    var t=e.target;if(t&&t.tagName==='IMG'&&t.id!=='lb-img')t.style.visibility='hidden';
  },true);

  /* ---------- start ---------- */
  try{var sv=localStorage.getItem(LS_SORT);if(sv&&SORTS.some(function(s){return s.k===sv}))S.sort=sv}catch(e){}
  try{var tv=localStorage.getItem(LS_TAB);if(tv&&(tv==='all'||TYPES.indexOf(tv)>=0))S.tab=tv}catch(e){}
  renderAll();

  window.__back=function(){
    if(!$('#lb').hidden){closeLb();return true}
    if(S.sheet){hideSheet();return true}
    return false;
  };
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
  boot();
})();
</script>
</body>
</html>
